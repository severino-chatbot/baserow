name: Build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: write
  packages: write

jobs:
  release-version:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate and tag version
        id: version
        run: |
          LAST=$(git tag --list "v*" | sort -V | tail -n1)
          VERSION=${LAST#v}
          [[ -z "$VERSION" ]] && VERSION="0.0.0"

          IFS='.' read -r M m p <<< "$VERSION"
          p=$((p+1))
          NEW="v$M.$m.$p"

          echo "version=$NEW" >> $GITHUB_OUTPUT
          git tag -a "$NEW" -m "Release $NEW"
          git push origin "$NEW"

  build:
    runs-on: ubuntu-latest
    needs: release-version
    if: always() && (needs.release-version.result == 'success' || needs.release-version.result == 'skipped')

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "IMAGE_TAG=pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV
            echo "IS_PUSH=false" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${{ needs.release-version.outputs.version }}" >> $GITHUB_ENV
            echo "IS_PUSH=true" >> $GITHUB_ENV
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.IS_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Passo 1: build do backend (dependência do all-in-one)
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: baserow_backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          load: true

      # Passo 2: build do web-frontend (dependência do all-in-one)
      - name: Build web-frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web-frontend/Dockerfile
          push: false
          tags: baserow_web-frontend:latest
          cache-from: type=gha,scope=web-frontend
          cache-to: type=gha,mode=max,scope=web-frontend
          load: true

      # Passo 3: build final all-in-one e push
      - name: Build and Push all-in-one
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/all-in-one/Dockerfile
          push: ${{ env.IS_PUSH == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/baserow:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository_owner }}/baserow:latest
          cache-from: type=gha,scope=all-in-one
          cache-to: type=gha,mode=max,scope=all-in-one